<div class="register-page">
  <div class="register-wrapper">
    <div class="register-media">
      <div class="media-overlay">
        <img [src]="logoUrl" [alt]="tenantName" style="max-width: 150px; margin-bottom: 1rem;">
        <h2>{{ tenantName }}</h2>
        <p>Únete a la mejor forma de organizar tu estilo.</p>
      </div>
    </div>

    <div class="register-form-container">
      <div class="register-header">
        <h1 class="logo-mobile">{{ tenantName }}</h1>
        <h2>Crea tu cuenta</h2>
        <p class="subtitle">Llena tus datos para comenzar</p>
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="register-form">

        <div class="form-grid">
          <div class="input-group">
            <label for="first_name">Nombre</label>
            <input type="text" id="first_name" name="first_name" [(ngModel)]="user.first_name" required
              placeholder="Ej. Neil" [ngClass]="{'input-error': errorMessage}">
          </div>

          <div class="input-group">
            <label for="last_name">Apellido</label>
            <input type="text" id="last_name" name="last_name" [(ngModel)]="user.last_name" required
              placeholder="Ej. Armstrong" [ngClass]="{'input-error': errorMessage}">
          </div>
        </div>

        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="user.email" required placeholder="correo@ejemplo.com"
            [ngClass]="{'input-error': errorMessage}">
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="nickname">Usuario (Nickname)</label>
            <input type="text" id="nickname" name="nickname" [(ngModel)]="user.nickname" required
              placeholder="Ej. Optimus" [ngClass]="{'input-error': errorMessage}">
          </div>

          <div class="input-group">
            <label for="date_birth">Fecha de Nacimiento</label>
            <input type="date" id="date_birth" name="date_birth" [(ngModel)]="user.date_birth" required [max]="maxDate"
              [ngClass]="{'input-error': errorMessage}">
          </div>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                [(ngModel)]="user.password" required placeholder="••••••••" [ngClass]="{'input-error': errorMessage}">
              <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                  </path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="input-group">
            <label for="confirm_password">Confirmar Contraseña</label>
            <div class="password-wrapper">
              <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirm_password" name="confirm_password"
                [(ngModel)]="user.confirm_password" required placeholder="••••••••"
                [ngClass]="{'input-error': errorMessage}">
              <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
                <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                  </path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label for="gender">Género</label>
          <div class="select-wrapper">
            <select id="gender" name="gender" [(ngModel)]="user.gender" required
              [ngClass]="{'input-error': errorMessage}">
              <option value="" disabled selected hidden>Elegir género...</option>
              <option value="Male">Masculino</option>
              <option value="Female">Femenino</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Registrarme</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

        <div class="login-link">
          ¿Ya tienes una cuenta? <a routerLink="/">Inicia Sesión</a>
        </div>
      </form>
    </div>
  </div>
</div>
