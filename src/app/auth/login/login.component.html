<div class="login-page">
    <div class="login-wrapper">
        <div class="login-media">
            <div class="media-overlay">
                <h2>WeiClothe</h2>
                <p>Gestiona tu armario inteligentemente</p>
            </div>
        </div>

        <div class="login-form-container">
            <div class="login-header">
                <h1 class="logo-mobile">WeiClothe</h1>
                <h2>Bienvenido de nuevo</h2>
                <p class="subtitle">Ingresa tus credenciales para acceder</p>
            </div>

            <div class="alert-box error" *ngIf="errorMessage">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ errorMessage }}</span>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" [(ngModel)]="email" required
                        placeholder="ejemplo@correo.com" [ngClass]="{'input-error': errorMessage}">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" [(ngModel)]="password" required
                        placeholder="••••••••" [ngClass]="{'input-error': errorMessage}">
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary" [disabled]="!loginForm.valid || isLoading">
                    <span *ngIf="!isLoading">Ingresar a mi cuenta</span>
                    <span *ngIf="isLoading" class="spinner"></span>
                </button>


                <div class="register-link">
                    ¿No tienes una cuenta? <a routerLink="/register">Regístrate</a>
                </div>
            </form>
        </div>
    </div>
</div>
